name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  api:
    name: API - lint, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mov
          POSTGRES_PASSWORD: mov_test_password
          POSTGRES_DB: mov_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mov -d mov_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://mov:mov_test_password@localhost:5432/mov_test
      TEST_DATABASE_URL: postgresql://mov:mov_test_password@localhost:5432/mov_test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      SESSION_TTL_SECONDS: 300
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint -- --no-fix
      - run: npm run typecheck
      - run: node --test test/safe-test-database.test.cjs
      - run: npm test -- --runInBand
      - run: npm run test:e2e:prepare
      - run: npm run test:e2e -- --runInBand
      - run: npm run build
  web:
    name: Web - lint e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      VITE_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  deploy:
    name: Deploy Render (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: mov-production-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Confirmar commit atual da main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          test "$current" = "$GITHUB_SHA" || { echo 'Commit substituido; deploy ignorado.'; exit 1; }
      - name: Verificar segredos de deploy
        env:
          API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          WEB_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        run: test -n "$API_HOOK" && test -n "$WEB_HOOK"
      - name: Aplicar migrations revisadas
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo 'PRODUCTION_DATABASE_URL nao configurada.'; exit 1; }
          npm run prisma:deploy
      - name: Solicitar deploy do commit validado
        env:
          GH_TOKEN: ${{ github.token }}
          API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          WEB_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        run: |
          test -n "$API_HOOK" && test -n "$WEB_HOOK" || { echo 'Deploy hooks nao configurados.'; exit 1; }
          current=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          test "$current" = "$GITHUB_SHA" || { echo 'Commit substituido; hooks nao executados.'; exit 1; }
          curl --fail --silent --output /dev/null --request POST "${API_HOOK}&ref=${GITHUB_SHA}"
          curl --fail --silent --output /dev/null --request POST "${WEB_HOOK}&ref=${GITHUB_SHA}"
