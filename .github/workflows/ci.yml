name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    name: API - lint, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mov
          POSTGRES_PASSWORD: mov_test_password
          POSTGRES_DB: mov_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mov -d mov_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://mov:mov_test_password@localhost:5432/mov_test
      TEST_DATABASE_URL: postgresql://mov:mov_test_password@localhost:5432/mov_test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      SESSION_TTL_SECONDS: 300
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint -- --no-fix
      - run: npm test -- --runInBand
      - run: npm run test:e2e:prepare
      - run: npm run test:e2e -- --runInBand
      - run: npm run build
  web:
    name: Web - lint e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      VITE_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
