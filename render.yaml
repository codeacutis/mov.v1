# Blueprint do Render para DEMONSTRAÇÃO acadêmica (D-019). Somente dados fictícios.
# Banco: Supabase (PostgreSQL) — não é criado aqui; informe DATABASE_URL no painel.
services:
  # API NestJS
  - type: web
    name: mov-api
    runtime: node
    plan: free
    rootDir: apps/api
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Supabase -> Connect -> "Session pooler" (porta 5432). Nunca versionar.
      - key: DATABASE_URL
        sync: false
      # Gerado pelo Render (mínimo exigido: 32 caracteres).
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_TTL_SECONDS
        value: "3600"
      # URL pública do front, SEM barra final (ex.: https://mov-web.onrender.com).
      - key: WEB_ORIGIN
        sync: false
      # Recuperação de senha por e-mail via API HTTP do Brevo (o Render free
      # bloqueia SMTP). Sem estas duas, o link não é enviado. Nunca versionar.
      - key: BREVO_API_KEY
        sync: false
      # E-mail remetente verificado no Brevo.
      - key: MAIL_FROM_EMAIL
        sync: false

  # Front React (site estático)
  - type: web
    name: mov-web
    runtime: static
    rootDir: apps/web
    autoDeployTrigger: 'off'
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Links do e-mail (/redefinir-senha?token=...) precisam cair no index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # URL pública da API, SEM barra final (ex.: https://mov-api.onrender.com).
      # É gravada no build: ao alterar, faça um novo deploy do front.
      - key: VITE_API_URL
        sync: false
